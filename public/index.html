<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Hit the boss, complete tasks and earn Telegram Stars!">
  <title>Hit the BOSS!</title>
  <link rel="icon" href="/assets/star.png">
  <link rel="preload" as="image" href="/assets/boss.webp">
  <link rel="preload" as="image" href="/assets/pedestal.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/vendor/confetti.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <!-- Background glow + drifting stars -->
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-stars" id="bg-stars" aria-hidden="true"></div>

  <!-- ===================== GAME SCREEN ===================== -->
  <main id="screen-game" class="screen active">
    <header class="hud">
      <div class="counter-card">
        <span class="counter-label">Stars<br>clicked:</span>
        <span class="counter-value"><img src="/assets/star.png" alt="" class="star-ico"><b id="score">0</b></span>
      </div>
      <button class="outline-btn" id="withdraw-btn" type="button">Withdraw</button>
    </header>

    <section class="arena">
      <div class="arena-glow"></div>
      <div class="light-beam" aria-hidden="true"></div>
      <div class="embers" id="embers" aria-hidden="true"></div>

      <div class="stage">
        <img class="pedestal" src="/assets/pedestal.webp" alt="" draggable="false">
        <div class="ped-glow" aria-hidden="true"></div>
        <button class="boss" id="boss" type="button" aria-label="Hit the boss">
          <img id="boss-img" src="/assets/boss.webp" alt="Boss — golden star" draggable="false">
        </button>
      </div>

      <div id="floaters" class="floaters" aria-hidden="true"></div>
      <div id="particles" class="particles" aria-hidden="true"></div>
    </section>

    <section class="bottom">
      <div class="hp-track" role="progressbar" aria-label="Boss health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="hp-bar">
        <div class="hp-fill" id="hp-fill"></div>
      </div>
      <h1 class="boss-title" id="boss-title">This is your first boss</h1>
      <p class="boss-sub" id="boss-sub">Hit him!</p>
      <button class="gold-btn hit-btn" id="hit-btn" type="button">
        <span class="tap-hint" aria-hidden="true"></span>
        <span class="btn-label">Hit the boss!</span>
      </button>
    </section>
  </main>

  <!-- ===================== WIN SCREEN ===================== -->
  <main id="screen-win" class="screen">
    <div class="win-wrap">
      <div class="prize-card" id="prize-card">
        <img class="prize-bg" src="/assets/card-bg.jpg" alt="">
        <div class="prize-shine"></div>
        <div class="prize-center">
          <div class="prize-amount"><img src="/assets/star.png" alt="" class="prize-star"><span id="prize-amount">5,000</span></div>
          <div class="prize-caption">Telegram Stars</div>
        </div>
      </div>

      <div class="badge"><img src="/assets/sparkles.png" alt="">BOSS DEFEATED</div>
      <h1 class="win-title">You killed the boss!</h1>
      <p class="win-line">You got <span class="pill"><b id="win-amount">5,000</b><img src="/assets/star.png" alt="" class="star-ico"></span></p>
      <p class="win-hint">You can claim your stars from me via the link</p>
    </div>
    <div class="win-footer">
      <button class="gold-btn claim-btn" id="claim-btn" type="button">
        <img src="/assets/star.png" alt="" class="btn-star">Claim <span id="claim-amount">5,000</span> stars
        <svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M21 3l-9 9"/><path d="M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></svg>
      </button>
      <button class="ghost-btn" id="again-btn" type="button">Next boss</button>
    </div>
  </main>

  <!-- White flash on the finishing blow -->
  <div class="flash" id="flash" aria-hidden="true"></div>

  <!-- Bottom sheet (Withdraw / Claim) -->
  <div class="sheet-backdrop" id="sheet-backdrop">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip"></div>
      <img class="sheet-ico" id="sheet-ico" src="/assets/star.png" alt="">
      <h2 id="sheet-title">Withdraw stars</h2>
      <p id="sheet-text">Defeat the boss to earn at least 5,000 stars, then claim your reward via the link.</p>
      <button class="gold-btn" id="sheet-ok" type="button">Got it</button>
    </section>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
