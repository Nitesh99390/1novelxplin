<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Join paid Telegram groups & channels with Telegram Stars.">
  <title>Star Pass — paid groups & channels</title>
  <link rel="icon" href="/assets/star.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/config.js"></script>
  <script src="/vendor/confetti.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <button class="back" id="back" aria-label="Back" hidden>‹</button>
    <div class="brand"><img src="/assets/star.png" alt=""><span id="title">Star Pass</span></div>
    <div class="me" id="me"></div>
  </header>

  <main id="view" class="view" aria-live="polite">
    <div class="loader"><span></span></div>
  </main>

  <nav class="tabs" id="tabs">
    <button data-tab="explore" class="active"><i>🔍</i><span>Explore</span></button>
    <button data-tab="my"><i>🎟️</i><span>My memberships</span><b class="dot" id="my-dot" hidden></b></button>
    <button data-tab="manage"><i>⚙️</i><span>Manage</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
