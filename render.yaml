services:
  - type: web
    name: star-pass-bot
    runtime: node
    # SQLite lives on a persistent disk. Render disks need a paid plan (starter).
    # On the free plan the database is wiped on every deploy/restart —
    # members would then never be removed. Use a disk in production.
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/bot.db
      - key: ADMIN_IDS
        sync: false
      - key: MINIAPP_SHORT_NAME
        sync: false
      # PUBLIC_URL defaults to RENDER_EXTERNAL_URL automatically
